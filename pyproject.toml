[project]
name = "nova-data-center-comparability"
version = "0.1.0"
description = "Traceable Northern Virginia data center comparability prototype"
requires-python = ">=3.12,<3.14"
dependencies = [
  "marimo==0.16.5",
  "pandas>=2.2,<3",
  "pandera[pandas]>=0.26,<0.27",
  "pdfplumber>=0.11,<0.12",
  "pyarrow>=19,<22",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
